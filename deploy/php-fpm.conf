[avto-platform]
user = avto_platform
group = avto_platform
listen = /run/php/avto-platform.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /var/www/avto-platform/shared/storage/logs/php-fpm-slow.log
chdir = /var/www/avto-platform/current
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_value[error_log] = /var/www/avto-platform/shared/storage/logs/php-fpm.log
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 5M
php_admin_value[post_max_size] = 64M
