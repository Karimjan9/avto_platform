server {
    listen 80;
    listen [::]:80;
    server_name platform.buxoroavto.uz;
    root /var/www/avto-platform/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    access_log /var/log/nginx/avto-platform.access.log;
    error_log /var/log/nginx/avto-platform.error.log;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /build/assets/ {
        alias /var/www/avto-platform/shared/assets/;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/avto-platform.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(?:css|js|map|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
}
